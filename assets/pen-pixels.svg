<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Quote: I write poems so machines remember what it means to feel — and write software so art reaches everyone.">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bf5"/>
      <stop offset="0.5" stop-color="#6fa4ff"/>
      <stop offset="1" stop-color="#f7c744"/>
    </linearGradient>
    <linearGradient id="titleGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c744"/>
      <stop offset="1" stop-color="#fde9a8"/>
      <stop offset="0" stop-color="#f7c744"/>
    </linearGradient>
    <radialGradient id="ink" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2f7bf5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2f7bf5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="992" height="232" rx="18" fill="#0d1117"/>
  <rect x="4" y="4" width="992" height="232" rx="18" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.45;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="18" y="18" width="964" height="204" rx="14" fill="url(#ink)"/>

  <text x="42" y="76" font-family="Georgia, serif" font-size="64" fill="#2f7bf5" opacity="0.55">&#8220;</text>

  <text x="110" y="92" font-family="Georgia, 'Palatino Linotype', serif" font-style="italic" font-size="24" fill="#e8ecf2">I write poems so machines remember what it means to feel &#8212;</text>
  <text x="110" y="128" font-family="Georgia, 'Palatino Linotype', serif" font-style="italic" font-size="24" fill="#e8ecf2">and write software so art reaches everyone.</text>

  <text x="110" y="170" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#98a2b3">&#8212; MOHAMMAD SHEIKH SHAHINUR RAHMAN · author of 36+ books</text>

  <g>
    <line x1="110" y1="196" x2="620" y2="196" stroke="#2f7bf5" stroke-width="1.5" opacity="0.6"/>
    <text x="640" y="203" font-family="'Noto Sans Bengali', 'Vrinda', 'Shonar Bangla', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f7c744">
      &#10023; এখানে অনেক আলো &#10023;
      <animate attributeName="opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="958" y="70" text-anchor="end" font-family="Georgia, serif" font-size="64" fill="#2f7bf5" opacity="0.55">&#8221;</text>
</svg>
